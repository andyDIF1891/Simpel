<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simptra — Partner Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f0eb;--surface:#fff;--border:#e8e8e2;--text:#1a1a1a;--muted:#888;
  --accent:#009688;--accent2:#00796B;
  --font:'Inter',sans-serif;
  --shadow:0 1px 4px rgba(0,0,0,0.08);--shadow-md:0 4px 16px rgba(0,0,0,0.12);
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,#00897B,#00BFA5);padding:0 28px;height:56px;display:flex;align-items:center;justify-content:space-between}
.header-logo{font-size:16px;font-weight:700;color:#fff}
.header-sub{font-size:12px;color:rgba(255,255,255,0.75)}
.main{max-width:800px;margin:0 auto;padding:28px 20px}
.page-title{font-size:22px;font-weight:700;margin-bottom:4px}
.page-sub{font-size:13px;color:#888;margin-bottom:24px}
.btn{padding:7px 16px;border-radius:8px;font-size:13px;font-family:var(--font);cursor:pointer;border:1px solid #e8e8e2;background:#fff;color:#555;font-weight:500}
.btn-green{background:var(--accent);color:#fff;border-color:transparent;width:100%;padding:10px}
.btn-green:hover{background:var(--accent2)}
.overlay{position:fixed;inset:0;background:linear-gradient(135deg,#00897B 0%,#00BFA5 50%,#1565c0 100%);display:none;align-items:center;justify-content:center;z-index:50}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:20px;width:420px;max-width:92vw;box-shadow:0 24px 80px rgba(0,0,0,0.25);padding:36px}
.modal-logo{font-size:22px;font-weight:800;color:#009688;letter-spacing:0.02em;margin-bottom:4px}
.modal-tag{font-size:12px;color:#888;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:24px}
.modal-title{font-size:20px;font-weight:700;margin-bottom:6px;color:#1a1a2e}
.modal-sub{font-size:13px;color:#888;margin-bottom:20px;line-height:1.6}
.fi{width:100%;background:#f5f5f0;border:1px solid #e8e8e2;border-radius:8px;padding:10px 14px;font-size:13px;font-family:var(--font);outline:none;color:var(--text);margin-bottom:12px}
.fi:focus{border-color:var(--accent);background:#fff}
.fi option{background:#fff;color:#1a1a1a}
textarea.fi{resize:vertical;min-height:70px;margin-bottom:0}
.forfragan-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.fc-route{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;margin-bottom:10px}
.fc-details{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#888;margin-bottom:14px}
.fc-details span{color:var(--text);font-weight:500}
.fc-date{font-size:11px;color:#888;margin-bottom:8px}
.anbud-form{background:#e0f2f1;border:2px solid #b2dfdb;border-radius:12px;padding:16px;margin-top:12px}
.af-title{font-size:13px;font-weight:600;color:var(--accent);margin-bottom:12px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.fl{font-size:11px;font-weight:500;color:#777;display:block;margin-bottom:4px}
.badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500}
.badge-ny{background:#e0f2f1;color:var(--accent)}
.badge-besvarat{background:#e8f5e9;color:#2e7d32}
.tabs{display:flex;gap:4px;margin-bottom:20px;background:#fff;border-radius:12px;padding:5px;border:1px solid var(--border);box-shadow:var(--shadow)}
.tab{flex:1;padding:9px;border:none;background:none;cursor:pointer;font-size:13px;font-family:var(--font);border-radius:8px;color:#888;font-weight:500}
.tab.active{background:var(--accent);color:#fff}
.empty{text-align:center;padding:48px;color:#bbb;font-size:13px}
.empty-icon{font-size:40px;margin-bottom:12px}
.toast{position:fixed;bottom:24px;right:24px;background:#fff;border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:10px;padding:12px 18px;font-size:13px;z-index:200;opacity:0;transform:translateY(8px);transition:all 0.25s;box-shadow:var(--shadow-md)}
.toast.show{opacity:1;transform:translateY(0)}

@media(max-width:600px){
  .header{padding:0 16px;height:52px}
  .header-logo{font-size:14px}
  .header-sub{font-size:11px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .main{padding:16px}
  .page-title{font-size:18px}
  .page-sub{font-size:12px}
  .tabs{padding:4px}
  .tab{font-size:12px;padding:8px 4px}
  .forfragan-card{padding:14px}
  .fc-route{font-size:14px;flex-wrap:wrap}
  .fc-details{gap:8px;font-size:11px}
  .form-grid{grid-template-columns:1fr}
  .anbud-form{padding:12px}
  .modal{padding:20px 16px}
  .btn-green{padding:12px}
}

/* SPRÅKVÄXLARE */
.lang-switch{display:flex;gap:2px;background:rgba(255,255,255,0.15);border-radius:20px;padding:3px;margin-left:8px}
.lang-btn{border:none;background:none;color:rgba(255,255,255,0.7);font-size:12px;font-weight:600;font-family:var(--font);cursor:pointer;padding:3px 9px;border-radius:14px;transition:all 0.15s}
.lang-btn.active{background:#fff;color:var(--accent)}
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">SIMPTRA — Partnerportal</div>
  <div style="display:flex;align-items:center;gap:8px">
    <div class="header-sub" id="header-namn"></div>
    <div class="lang-switch"><button class="lang-btn active" onclick="setLang('sv')">SV</button><button class="lang-btn" onclick="setLang('en')">EN</button></div>
    <button id="btn-logga-ut" onclick="loggaUtPartner()" style="display:none;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit">Logga ut</button>
  </div>
</div>

<div class="overlay open" id="namn-overlay">
  <div class="modal">
    <div class="modal-logo">SIMPTRA</div>
    <div class="modal-tag">🤝 Partnerportal</div>
    <div class="modal-title" id="modal-welcome">Välkommen!</div>
    <div class="modal-sub" id="modal-sub">Logga in med ditt partner-konto för att se förfrågningar och lämna anbud.</div>
    <input class="fi" id="partner-email-input" type="email" placeholder="Din email" onkeydown="if(event.key==='Enter')loggaInPartner()">
    <div id="otp-step" style="display:none;margin-top:10px">
      <input class="fi" id="partner-otp-input" type="text" inputmode="numeric" maxlength="8" placeholder="8-siffrig kod" style="letter-spacing:0.3em;font-size:18px;text-align:center" onkeydown="if(event.key==='Enter')verifieraOTP()">
    </div>
    <div id="login-err" style="color:#ef4444;font-size:12px;margin-top:8px;display:none"></div>
    <div id="login-ok" style="color:#16a34a;font-size:13px;margin-top:8px;display:none;line-height:1.5"></div>
    <button class="btn btn-green" onclick="loggaInPartner()" id="btn-fortsatt">Skicka kod →</button>
    <button class="btn btn-green" onclick="verifieraOTP()" id="btn-verifiera" style="display:none">Logga in →</button>
  </div>
</div>

<div class="main">
  <div class="page-title" id="page-title">Förfrågningar från Simptra</div>
  <div class="page-sub" id="page-sub">Besvara förfrågningar med era bästa priser</div>
  <div class="tabs">
    <button class="tab active" id="tab-nya-btn" onclick="showTab('nya',this)">🔔 Nya förfrågningar</button>
    <button class="tab" id="tab-besvarade-btn" onclick="showTab('besvarade',this)">✓ Mina anbud</button>
  </div>
  <div id="tab-nya"></div>
  <div id="tab-besvarade" style="display:none"></div>
</div>

<div class="toast" id="toast"></div>

<script>

// API proxy via Cloudflare Worker
const WORKER = 'https://claudeproxy.andreas-karlsson.workers.dev';
const _origFetch = window.fetch.bind(window);
window.fetch = function(url, opts) {
  if (typeof url === 'string' && url.includes('tahwecikznaomcppqadf.supabase.co')) {
    // Bara ersätt REST och Storage - INTE auth-anrop
    if (url.includes('/rest/v1/') || url.includes('/storage/v1/')) {
      url = url
        .replace('https://tahwecikznaomcppqadf.supabase.co/rest/v1/', WORKER + '/api/')
        .replace('https://tahwecikznaomcppqadf.supabase.co/storage/v1/', WORKER + '/storage/');
      if (opts && opts.headers) {
        const h = opts.headers;
        delete h['apikey'];
        delete h['Authorization'];
      }
    }
  }
  return _origFetch(url, opts);
};

const SB_URL = 'https://tahwecikznaomcppqadf.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRhaHdlY2lrem5hb21jcHBxYWRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMjQ3NTMsImV4cCI6MjA5MzYwMDc1M30.mOjvfAAMJt5rvv-QvQG6LfEAsK7WaxMdINSM89xhq9E';
const sb = supabase.createClient(SB_URL, SB_KEY);

let partnerNamn = localStorage.getItem('partner_namn')||'';
let partnerEmail = localStorage.getItem('partner_email')||'';
let forfragan = [];
let mina_anbud = [];


// ===== I18N =====
const T = {
  sv: {
    welcome:'Välkommen!', modal_sub:'Ange ditt namn och företag för att fortsätta',
    namn_ph:'Ditt namn / Företag', email_ph:'Din email (för bekräftelse)',
    fortsatt:'Fortsätt →', page_title:'Förfrågningar från Simptra',
    page_sub:'Besvara förfrågningar med era bästa priser',
    tab_nya:'🔔 Nya förfrågningar', tab_besvarade:'✓ Mina anbud',
    empty_nya:'Inga nya förfrågningar just nu', empty_besvarade:'Du har inte besvarat några förfrågningar ännu',
    date:'Datum:', cargo:'Gods:', weight:'Vikt:', volume:'Volym:',
    incoterms:'Incoterms:', container:'Container:', crd:'CRD:',
    submit_quote:'💰 Lämna offert', add_row:'+ Lägg till rad',
    description:'Beskrivning', qty:'Antal', unit_price:'À-pris',
    currency:'Valuta', transit:'Leveranstid', transit_ph:'t.ex. 3-4 veckor',
    total:'Summa', msg_terms:'Meddelande / villkor',
    msg_ph:'Eventuella villkor, transiteringstider, speciella noter...',
    send:'📤 Skicka offert till Simptra',
    accepted:'🎉 Accepterat!', declined:'❌ Nekat', awaiting:'⏳ Inväntar svar',
    comment:'Kommentar från Simptra:',
    toast_name:'Ange ditt namn', toast_price:'Ange minst ett pris',
    toast_sent:'✓ Offert skickad till Simptra!',
    badge_ny:'Ny', badge_besvarat:'✓ Besvarat',
    sea:'Sjöfrakt', air:'Flygfrakt', road:'Landtransport',
  },
  en: {
    welcome:'Welcome!', modal_sub:'Enter your name and company to continue',
    namn_ph:'Your name / Company', email_ph:'Your email (for confirmation)',
    fortsatt:'Continue →', page_title:'Requests from Simptra',
    page_sub:'Respond to requests with your best prices',
    tab_nya:'🔔 New requests', tab_besvarade:'✓ My quotes',
    empty_nya:'No new requests at the moment', empty_besvarade:'You have not responded to any requests yet',
    date:'Date:', cargo:'Cargo:', weight:'Weight:', volume:'Volume:',
    incoterms:'Incoterms:', container:'Container:', crd:'CRD:',
    submit_quote:'💰 Submit quote', add_row:'+ Add row',
    description:'Description', qty:'Qty', unit_price:'Unit price',
    currency:'Currency', transit:'Transit time', transit_ph:'e.g. 3-4 weeks',
    total:'Total', msg_terms:'Message / terms',
    msg_ph:'Any terms, transit times, special notes...',
    send:'📤 Send quote to Simptra',
    accepted:'🎉 Accepted!', declined:'❌ Declined', awaiting:'⏳ Awaiting response',
    comment:'Comment from Simptra:',
    toast_name:'Please enter your name', toast_price:'Please enter at least one price',
    toast_sent:'✓ Quote sent to Simptra!',
    badge_ny:'New', badge_besvarat:'✓ Responded',
    sea:'Sea freight', air:'Air freight', road:'Road transport',
  }
};
let lang = localStorage.getItem('simptra_partner_lang') || 'sv';

function setLang(l) {
  lang = l;
  localStorage.setItem('simptra_partner_lang', l);
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.toLowerCase() === l);
  });
  applyLang();
  renderTabs(); // Återrendera dynamisk HTML med nytt språk
}

function t(key){ return T[lang][key] || T['sv'][key] || key; }

function applyLang(){
  const L = T[lang];
  const set = (id,k) => { const el=document.getElementById(id); if(el&&L[k]) el.textContent=L[k]; };
  const setPh = (id,k) => { const el=document.getElementById(id); if(el&&L[k]) el.placeholder=L[k]; };
  set('modal-welcome','welcome');
  set('modal-sub','modal_sub');
  setPh('partner-namn','namn_ph');
  setPh('partner-email','email_ph');
  set('btn-fortsatt','fortsatt');
  set('page-title','page_title');
  set('page-sub','page_sub');
  set('tab-nya-btn','tab_nya');
  set('tab-besvarade-btn','tab_besvarade');
}

// Init
document.addEventListener('DOMContentLoaded', ()=>{
  document.querySelectorAll('.lang-btn').forEach(b=>{
    b.classList.toggle('active', b.textContent.toLowerCase()===lang);
  });
  applyLang();
});
async function loggaUtPartner(){
  await sb.auth.signOut();
  partnerEmail = '';
  partnerNamn = '';
  document.getElementById('btn-logga-ut').style.display = 'none';
  document.getElementById('header-namn').textContent = '';
  document.getElementById('namn-overlay').classList.add('open');
  document.getElementById('partner-email-input').disabled = false;
  document.getElementById('partner-email-input').value = '';
  document.getElementById('btn-fortsatt').style.display = 'block';
  document.getElementById('btn-verifiera').style.display = 'none';
  document.getElementById('otp-step').style.display = 'none';
  document.getElementById('login-ok').style.display = 'none';
  document.getElementById('login-err').style.display = 'none';
}

async function loggaInPartner(){
  const email = document.getElementById('partner-email-input').value.trim();
  const err   = document.getElementById('login-err');
  const ok    = document.getElementById('login-ok');
  const btn   = document.getElementById('btn-fortsatt');
  err.style.display = 'none';
  ok.style.display = 'none';
  if(!email){ err.textContent='Fyll i din email'; err.style.display='block'; return; }

  btn.textContent = 'Skickar...';
  btn.disabled = true;

  const {error} = await sb.auth.signInWithOtp({
    email,
    options: { shouldCreateUser: false }
  });

  btn.disabled = false;
  btn.textContent = 'Skicka kod →';

  if(error){ err.textContent='Kunde inte skicka kod — kontrollera att emailen är registrerad'; err.style.display='block'; return; }

  ok.innerHTML = '✅ Kolla din inbox!<br>Ange den 8-siffriga koden från mailet.';
  ok.style.display = 'block';
  document.getElementById('partner-email-input').disabled = true;
  btn.style.display = 'none';
  document.getElementById('otp-step').style.display = 'block';
  document.getElementById('btn-verifiera').style.display = 'block';
  setTimeout(()=>document.getElementById('partner-otp-input').focus(), 100);
}

async function verifieraOTP(){
  const email = document.getElementById('partner-email-input').value.trim();
  const token = document.getElementById('partner-otp-input').value.trim();
  const err   = document.getElementById('login-err');
  err.style.display = 'none';
  if(!token || token.length < 8){ err.textContent='Ange den 8-siffriga koden'; err.style.display='block'; return; }

  const btn = document.getElementById('btn-verifiera');
  btn.textContent = 'Verifierar...';
  btn.disabled = true;

  const {data, error} = await sb.auth.verifyOtp({ email, token, type: 'email' });

  btn.disabled = false;
  btn.textContent = 'Logga in →';

  if(error){ err.textContent='Fel kod — försök igen'; err.style.display='block'; return; }

  partnerEmail = email;
  partnerNamn  = data.user?.user_metadata?.full_name || email;
  visaPartnerPortal();
}

function visaPartnerPortal(){
  const btn = document.getElementById('btn-logga-ut');
  if(btn) btn.style.display = 'block';
  document.getElementById('namn-overlay').classList.remove('open');
  document.getElementById('header-namn').textContent = partnerNamn;
  laddaForfragan();
}

// Check if already logged in
(async()=>{
  const {data} = await sb.auth.getSession();
  if(data?.session){
    partnerEmail = data.session.user.email;
    partnerNamn  = data.session.user.user_metadata?.full_name || partnerEmail;
    visaPartnerPortal();
  }
})();

async function laddaForfragan(){
  const _ffResp = await fetch(SB_URL+'/rest/v1/forfragan?status=in.(skickad,erbjuden,accepterad)&order=created_at.desc',{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
  const ff = await _ffResp.json();
  forfragan = ff||[];
  if(partnerEmail){
    const _aaResp = await fetch(SB_URL+'/rest/v1/anbud?partner_email=eq.'+encodeURIComponent(partnerEmail),{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
    const aa = await _aaResp.json();
    mina_anbud = aa||[];
  }
  renderTabs();
}

function showTab(tab, btn){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-nya').style.display = tab==='nya'?'block':'none';
  document.getElementById('tab-besvarade').style.display = tab==='besvarade'?'block':'none';
}

function renderTabs(){
  const besvarade_ids = mina_anbud.map(a=>a.forfragan_id);
  const nya = forfragan.filter(f=>!besvarade_ids.includes(f.id));
  const besvarade = forfragan.filter(f=>besvarade_ids.includes(f.id));
  renderList('tab-nya', nya, true);
  renderList('tab-besvarade', besvarade, false);
}

function renderList(elId, data, visaForm){
  const el = document.getElementById(elId);
  if(!data.length){
    el.innerHTML = `<div class="empty"><div class="empty-icon">${visaForm?'🔔':'✓'}</div>${visaForm?t('empty_nya'):t('empty_besvarade')}</div>`;
    return;
  }
  el.innerHTML = data.map(f=>{
    const datum = f.datum ? new Date(f.datum).toLocaleDateString('sv-SE') : '–';
    const mittAnbud = mina_anbud.find(a=>a.forfragan_id===f.id);
    return `<div class="forfragan-card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div class="fc-date">${new Date(f.created_at).toLocaleDateString('sv-SE')} · <b>${f.transport_typ||''}</b></div>
        ${mittAnbud?`<span class="badge badge-besvarat">✓ Besvarat</span>`:`<span class="badge badge-ny">Ny</span>`}
      </div>
      <div class="fc-route">
        <span>${f.från_ort||'–'}</span>
        <span style="color:#ccc;font-size:18px">→</span>
        <span>${f.till_ort||'–'}</span>
      </div>
      <div class="fc-details">
        <div>Datum: <span>${datum}</span></div>
        ${f.gods_typ?`<div>Gods: <span>${f.gods_typ}</span></div>`:''}
        ${f.vikt?`<div>Vikt: <span>${f.vikt}</span></div>`:''}
        ${f.volym?`<div>Volym: <span>${f.volym}</span></div>`:''}
        ${f.incoterms?`<div>Incoterms: <span>${f.incoterms}</span></div>`:''}
        ${f.lcl_fcl?`<div><span>${f.lcl_fcl}</span></div>`:''}
        ${f.container?`<div>Container: <span>${f.container}</span></div>`:''}
        ${f.crd?`<div>CRD: <span>${new Date(f.crd).toLocaleDateString('sv-SE')}</span></div>`:''}
      </div>
      ${f.meddelande?`<div style="font-size:12px;color:#666;background:#f9f9f7;border-radius:8px;padding:10px;margin-bottom:12px">${f.meddelande}</div>`:''}
      ${visaForm && !mittAnbud ? `
        <div class="anbud-form">
          <div class="af-title">💰 Lämna offert</div>
          
          <!-- Offert rader -->
          <div style="background:#fff;border-radius:8px;overflow:hidden;margin-bottom:10px;border:1px solid #b2dfdb">
            <div style="display:grid;grid-template-columns:1fr 90px 100px 32px;gap:0;padding:7px 10px;background:#e0f2f1;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.07em;color:#00695c">
              <span>Beskrivning</span><span>Antal</span><span style="text-align:right">À-pris</span><span></span>
            </div>
            <div id="offert-rader-${f.id}">
              <div class="offert-rad" style="display:grid;grid-template-columns:1fr 90px 100px 32px;gap:6px;padding:8px 10px;border-top:1px solid #e0f2f1;align-items:center">
                <input class="fi" style="margin:0;padding:6px 8px" placeholder="t.ex. Sjöfrakt FCL" id="desc-${f.id}-0">
                <input class="fi" style="margin:0;padding:6px 8px;font-family:monospace" type="number" value="1" id="antal-${f.id}-0" oninput="uppdateraSumma('${f.id}')">
                <input class="fi" style="margin:0;padding:6px 8px;font-family:monospace;text-align:right" type="number" value="0" id="pris-${f.id}-0" oninput="uppdateraSumma('${f.id}')">
                <span></span>
              </div>
            </div>
          </div>
          
          <button onclick="laggTillRad('${f.id}')" class="btn" style="width:100%;font-size:12px;margin-bottom:12px;border-color:#b2dfdb;color:var(--accent)">+ Lägg till rad</button>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
            <div><label class="fl">Valuta</label>
              <select class="fi" style="margin:0" id="valuta-${f.id}">

              </select>

          <div style="background:#fff;border-radius:8px;padding:12px;margin-bottom:10px;border:1px solid #b2dfdb">

  }).join('');
}

// ===== OFFERT RADER =====
const radCount = {};

function laggTillRad(fid){
  const container = document.getElementById('offert-rader-'+fid);
  if(!container) return;
  const i = (radCount[fid]||1);
  radCount[fid] = i+1;
  const div = document.createElement('div');
  div.className = 'offert-rad';
  div.style.cssText = 'display:grid;grid-template-columns:1fr 90px 100px 32px;gap:6px;padding:8px 10px;border-top:1px solid #e0f2f1;align-items:center';
  div.innerHTML = `
    <input class="fi" style="margin:0;padding:6px 8px" placeholder="Beskrivning..." id="desc-${fid}-${i}">
    <input class="fi" style="margin:0;padding:6px 8px;font-family:monospace" type="number" value="1" id="antal-${fid}-${i}" oninput="uppdateraSumma('${fid}')">
    <input class="fi" style="margin:0;padding:6px 8px;font-family:monospace;text-align:right" type="number" value="0" id="pris-${fid}-${i}" oninput="uppdateraSumma('${fid}')">
    <button onclick="this.closest('.offert-rad').remove();uppdateraSumma('${fid}')" style="background:none;border:none;cursor:pointer;color:#ccc;font-size:16px" onmouseover="this.style.color='#ef4444'" onmouseout="this.style.color='#ccc'">✕</button>
  `;
  container.appendChild(div);
}

function uppdateraSumma(fid){
  const container = document.getElementById('offert-rader-'+fid);
  if(!container) return;
  let summa = 0;
  container.querySelectorAll('.offert-rad').forEach((rad,i)=>{
    const antal = parseFloat(rad.querySelector('[id^="antal-"]')?.value)||0;
    const pris  = parseFloat(rad.querySelector('[id^="pris-"]')?.value)||0;
    summa += antal*pris;
  });
  const el = document.getElementById('summa-'+fid);
  if(el) el.textContent = Math.round(summa).toLocaleString('sv-SE')+' '+(document.getElementById('valuta-'+fid)?.value||'SEK');
}

async function skickaAnbud(forfraganId){
  if(!partnerNamn){ toast('Ange ditt namn först'); return; }

  // Collect rows
  const container = document.getElementById('offert-rader-'+forfraganId);
  let rader = [];
  let totalPris = 0;
  if(container){
    container.querySelectorAll('.offert-rad').forEach(rad=>{
      const desc  = rad.querySelector('[id^="desc-"]')?.value||'';
      const antal = parseFloat(rad.querySelector('[id^="antal-"]')?.value)||1;
      const pris  = parseFloat(rad.querySelector('[id^="pris-"]')?.value)||0;
      if(desc||pris>0){ rader.push({desc,antal,pris}); totalPris+=antal*pris; }
    });
  }
  if(totalPris===0){ toast(t('toast_price')); return; }

  const valuta    = document.getElementById('valuta-'+forfraganId)?.value||'SEK';
  const leverans  = document.getElementById('leverans-'+forfraganId)?.value||'';
  const msg       = document.getElementById('msg-'+forfraganId)?.value||'';

  const _anBody = {
    forfragan_id: forfraganId, partner_namn: partnerNamn, partner_email: partnerEmail,
    pris: totalPris, valuta, leveranstid: leverans,
    meddelande: msg + (rader.length>0 ? '\n\nRader:\n'+rader.map(r=>`${r.desc}: ${r.antal} x ${Math.round(r.pris).toLocaleString('sv-SE')} ${valuta}`).join('\n') : ''),
    status: 'inkommen',
  };
  const _anResp = await fetch(SB_URL+'/rest/v1/anbud', {method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(_anBody)});
  const error = _anResp.ok ? null : await _anResp.json();

  if(error){ toast('Fel: '+(error.message||_anResp.status)); return; }
  toast(t('toast_sent'));
  await laddaForfragan();
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

// ===== POD HANTERING =====
async function checkPODParam(){
  const params = new URLSearchParams(window.location.search);
  const bokId = params.get('pod');
  if(!bokId) return;

  // Hämta bokning
  const resp = await fetch(SB_URL+'/rest/v1/bokningar?id=eq.'+bokId+'&select=*',{
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
  });
  const data = await resp.json();
  const bok = data?.[0];
  if(!bok){ document.body.innerHTML='<div style="font-family:sans-serif;text-align:center;padding:60px;color:#666">Bokning hittades inte.</div>'; return; }

  // Visa POD-vy direkt utan inloggning
  document.body.innerHTML = `
    <div style="font-family:Inter,sans-serif;max-width:560px;margin:60px auto;padding:0 20px">
      <div style="background:linear-gradient(135deg,#00897B,#00BFA5);padding:24px;border-radius:14px 14px 0 0;text-align:center">
        <div style="font-size:28px;margin-bottom:8px">📦</div>
        <h1 style="color:#fff;margin:0;font-size:20px">Ladda upp Proof of Delivery</h1>
        <p style="color:rgba(255,255,255,0.85);margin:6px 0 0;font-size:13px">Simptra AB</p>
      </div>
      <div style="background:#fff;border:1px solid #e8e8e2;border-top:none;border-radius:0 0 14px 14px;padding:24px">
        <div style="background:#f9f9f7;border-radius:10px;padding:14px;margin-bottom:20px">
          <div style="font-size:12px;color:#888">Bokning</div>
          <div style="font-size:17px;font-weight:600;margin-top:2px">${bok.ref||'–'}</div>
          <div style="font-size:13px;color:#666;margin-top:4px">${bok.kund} · ${bok.typ||''}</div>
          ${bok.pod_url?`<div style="margin-top:10px;padding:8px;background:#e8f5e9;border-radius:8px;font-size:12px;color:#2e7d32">✅ POD redan uppladdad — du kan ladda upp en ny version nedan.</div>`:''}
        </div>

        <div id="pod-drop" style="border:2px dashed #ccc;border-radius:10px;padding:32px;text-align:center;cursor:pointer;margin-bottom:16px;transition:all 0.2s"
          ondragover="event.preventDefault();this.style.borderColor='#009688';this.style.background='#f0faf8'"
          ondragleave="this.style.borderColor='#ccc';this.style.background=''"
          ondrop="event.preventDefault();this.style.borderColor='#ccc';this.style.background='';hanteraPODFil(event.dataTransfer.files[0])">
          <div style="font-size:32px;margin-bottom:8px">📎</div>
          <div style="font-size:14px;font-weight:500;color:#444">Dra och släpp filen här</div>
          <div style="font-size:12px;color:#888;margin-top:4px">eller</div>
          <label style="display:inline-block;margin-top:10px;background:#009688;color:#fff;padding:8px 20px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500">
            Välj fil
            <input type="file" accept=".pdf,.jpg,.jpeg,.png" style="display:none" onchange="hanteraPODFil(this.files[0])">
          </label>
          <div style="font-size:11px;color:#bbb;margin-top:8px">PDF, JPG eller PNG</div>
        </div>

        <div id="pod-preview" style="display:none;background:#f0faf8;border:1px solid #b2dfdb;border-radius:10px;padding:14px;margin-bottom:16px">
          <div style="font-size:13px;font-weight:500;color:#00695c" id="pod-filnamn"></div>
          <div style="font-size:12px;color:#888;margin-top:2px" id="pod-filstorlek"></div>
        </div>

        <button id="pod-btn" onclick="laddaUppPOD('${bokId}')" disabled
          style="width:100%;background:#ccc;color:#fff;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:600;cursor:not-allowed;font-family:Inter,sans-serif;transition:all 0.2s">
          Ladda upp POD
        </button>
        <div id="pod-status" style="margin-top:12px;text-align:center;font-size:13px;color:#666"></div>
      </div>
    </div>
  `;
}

let _podFil = null;

function hanteraPODFil(fil){
  if(!fil) return;
  _podFil = fil;
  document.getElementById('pod-preview').style.display = 'block';
  document.getElementById('pod-filnamn').textContent = '📄 '+fil.name;
  document.getElementById('pod-filstorlek').textContent = Math.round(fil.size/1024)+' KB';
  const btn = document.getElementById('pod-btn');
  btn.disabled = false;
  btn.style.background = '#009688';
  btn.style.cursor = 'pointer';
}

async function laddaUppPOD(bokId){
  if(!_podFil) return;
  const btn = document.getElementById('pod-btn');
  const status = document.getElementById('pod-status');
  btn.textContent = '⏳ Laddar upp...';
  btn.disabled = true;

  try {
    // Ladda upp till storage
    const path = 'bokning-'+bokId+'/POD-'+_podFil.name;
    const uploadResp = await fetch(SB_URL+'/storage/v1/object/bokningar-docs/'+path, {
      method:'POST',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':_podFil.type,'x-upsert':'true'},
      body: _podFil
    });

    if(!uploadResp.ok){ throw new Error('Upload failed'); }

    // Uppdatera bokning med POD-info
    const podUrl = SB_URL+'/storage/v1/object/bokningar-docs/'+path;
    await fetch('https://claudeproxy.andreas-karlsson.workers.dev/update-bokning', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id: bokId, fields:{
        pod_url: podUrl,
        pod_uppladdad_at: new Date().toISOString()
      }})
    });

    // Skicka bekräftelsemail till Simptra
    await fetch('https://claudeproxy.andreas-karlsson.workers.dev/mail', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        from: 'Simptra AB <onboarding@resend.dev>',
        to: ['andreas.karlsson@simpeltransport.se'],
        subject: '✅ POD uppladdad — bokning '+bokId.substring(0,8),
        html: `<p>POD har laddats upp för bokning <strong>${bokId.substring(0,8)}</strong>.</p><p>Fil: ${_podFil.name}</p>`
      })
    });

    btn.textContent = '✅ POD uppladdad!';
    btn.style.background = '#2e7d32';
    status.innerHTML = '<span style="color:#2e7d32;font-weight:500">✓ Tack! POD mottagen. Simptra har fått en notifiering.</span>';

  } catch(e){
    btn.textContent = 'Ladda upp POD';
    btn.disabled = false;
    btn.style.background = '#009688';
    status.innerHTML = '<span style="color:#e53e3e">Fel vid uppladdning — försök igen.</span>';
  }
}

// Kolla om det är ett POD-anrop
checkPODParam();
